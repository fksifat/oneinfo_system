name: oneinfo-vps

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneinfo
      POSTGRES_USER: oneinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneinfo -d oneinfo"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build
    env_file: .env.vps
    environment: &api-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://oneinfo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@postgres:5432/oneinfo
    depends_on:
      postgres:
        condition: service_healthy
    command: [npm, run, db:migrate, --workspace, "@oneinfo/api"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    restart: unless-stopped
    init: true
    env_file: .env.vps
    environment: *api-environment
    ports:
      - "127.0.0.1:3301:3001"
    volumes:
      - product-media:/app/.product-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres-data:
  product-media:
