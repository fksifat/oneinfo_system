server {
    listen 80;
    server_name api.oneinfo.online;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/oneinfo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.oneinfo.online;
    ssl_certificate /etc/nginx/certs/oneinfo/letsencrypt/live/api.oneinfo.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/oneinfo/letsencrypt/live/api.oneinfo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location = /api/v1/local-nfc { return 404; }
    location ^~ /api/v1/local-nfc/ { return 404; }
    location = /api/v1/dev { return 404; }
    location ^~ /api/v1/dev/ { return 404; }

    location / {
        proxy_pass http://172.18.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
