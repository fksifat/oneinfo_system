services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oneinfo
      POSTGRES_USER: oneinfo
      POSTGRES_PASSWORD: oneinfo
    ports:
      - "127.0.0.1:${ONEINFO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - oneinfo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneinfo -d oneinfo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oneinfo-postgres:
